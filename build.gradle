plugins {
    id 'base'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'application'
    apply plugin: 'checkstyle'

    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    application { mainClass = "bonus.${project.name}.Demo" }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    }
    checkstyle {
        toolVersion = '10.21.2'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }
}

tasks.register('runAllDemos') {
    group = 'application'
    description = 'Run all twenty independent demos.'
    dependsOn subprojects.collect { it.tasks.named('run') }
}
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
